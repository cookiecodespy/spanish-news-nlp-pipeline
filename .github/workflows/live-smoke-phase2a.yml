name: phase-2a-live-smoke

on:
  push:
    branches:
      - v2/html-ingestion
    paths:
      - ".github/workflows/live-smoke-phase2a.yml"

permissions:
  contents: read

jobs:
  live-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover one official source
        run: |
          python -m research_pipeline.live_discovery \
            --source anthropic-engineering \
            --state .state/phase2a-smoke.sqlite3 \
            --delay 0.25 > discovery.json
          cat discovery.json

      - name: Ingest one discovered HTML candidate
        run: |
          python -m research_pipeline.ingestion \
            --source anthropic-engineering \
            --state .state/phase2a-smoke.sqlite3 \
            --limit 1 \
            --delay 0.25 > ingestion.json
          cat ingestion.json

      - name: Verify exact-byte evidence locally
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          payload = json.loads(Path("ingestion.json").read_text())
          assert payload["ok"] is True, payload
          assert payload["processed"] == 1, payload
          assert payload["new_count"] == 1, payload
          assert payload["unchanged_count"] == 0, payload
          assert payload["changed_count"] == 0, payload
          assert payload["error_count"] == 0, payload

          item = payload["results"][0]
          assert item["status"] == "SUCCESS", item
          assert item["classification"] == "NEW", item
          assert item["requested_url"].startswith("https://www.anthropic.com/engineering/"), item
          assert item["final_url"].startswith("https://www.anthropic.com/engineering/"), item

          object_path = Path(".state") / item["object_path"]
          body = object_path.read_bytes()
          assert len(body) == item["bytes_read"], item
          assert hashlib.sha256(body).hexdigest() == item["sha256"], item
          print(
              "phase 2a live evidence verified:",
              item["requested_url"],
              item["sha256"],
              item["bytes_read"],
              "bytes",
          )
          PY

      - name: Upload metadata evidence only
        uses: actions/upload-artifact@v4
        with:
          name: phase-2a-live-ingestion-metadata
          path: |
            discovery.json
            ingestion.json
          retention-days: 14
