name: phase-3a-live-smoke

on:
  push:
    branches:
      - v2/html-normalization
    paths:
      - ".github/workflows/live-smoke-phase3a.yml"

permissions:
  contents: read

jobs:
  verify-google-research-candidate-hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Discover Google Research after pseudo-link fix
        run: |
          mkdir -p evidence
          python -m research_pipeline.live_discovery \
            --source google-research-publications \
            --state .state/google-research-publications.sqlite3 \
            --delay 0.25 > evidence/google-research-publications-discovery.json
          cat evidence/google-research-publications-discovery.json

      - name: Verify malformed pseudo-link is absent
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(
              Path("evidence/google-research-publications-discovery.json").read_text()
          )
          assert payload["ok"] is True, payload
          candidates = payload["new_candidates"]
          assert candidates, payload
          assert not any("javascript" in url.lower() for url in candidates), candidates
          print("google research candidate hygiene verified:", len(candidates), "candidates")
          PY

      - name: Ingest and normalize one clean candidate
        run: |
          python -m research_pipeline.ingestion \
            --source google-research-publications \
            --state .state/google-research-publications.sqlite3 \
            --limit 1 \
            --delay 0.25 > evidence/google-research-publications-ingestion.json
          python -m research_pipeline.normalization \
            --source google-research-publications \
            --state .state/google-research-publications.sqlite3 \
            --limit 1 > evidence/google-research-publications-normalization.json
          cat evidence/google-research-publications-normalization.json

      - name: Verify normalized evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          ingestion = json.loads(
              Path("evidence/google-research-publications-ingestion.json").read_text()
          )
          normalization = json.loads(
              Path("evidence/google-research-publications-normalization.json").read_text()
          )
          assert ingestion["ok"] is True and ingestion["error_count"] == 0, ingestion
          assert normalization["ok"] is True and normalization["error_count"] == 0, normalization
          raw_item = ingestion["results"][0]
          item = normalization["results"][0]
          assert item["raw_sha256"] == raw_item["sha256"], (item, raw_item)
          artifact_path = Path(".state") / item["artifact_path"]
          artifact_bytes = artifact_path.read_bytes()
          assert hashlib.sha256(artifact_bytes).hexdigest() == item["normalized_sha256"]
          assert item["block_count"] > 0 and item["char_count"] > 0, item
          print(
              "google research normalization reverified:",
              item["requested_url"],
              item["normalized_sha256"],
          )
          PY

      - name: Upload metadata evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase-3a-google-research-hygiene-metadata
          path: evidence/*.json
          retention-days: 14
